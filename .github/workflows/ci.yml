name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.12', '3.13']
        exclude:
          # Windows keeps one interpreter so the offline suite stays inside
          # the CI time budget; 3.13 is covered on Linux.
          - os: windows-2025
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python scripts/dev.py setup-node
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/dev.py check
      - run: python scripts/dev.py test
