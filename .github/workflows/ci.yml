name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  test:
    # The machine gate matches the two platform job names exactly, so the
    # default 3.12 rows must stay "test (<os>)" while the extra 3.13 row keeps
    # its version suffix.  A plain matrix would name every row with both values.
    name: ${{ matrix.python-version == '3.12' && format('test ({0})', matrix.os) || format('test ({0}, {1})', matrix.os, matrix.python-version) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.12', '3.13']
        exclude:
          # Windows keeps one interpreter so the offline suite stays inside
          # the CI time budget; 3.13 is covered on Linux.
          - os: windows-2025
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          # Batch 8 proves every module delivery commit is an ancestor of the
          # candidate; a depth-1 checkout cannot resolve those objects.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python scripts/dev.py setup-node
      - name: Install Chromium with Linux system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - run: python -c "import pathlib; pathlib.Path('artifacts').mkdir(exist_ok=True)"
      - run: python scripts/dev.py check
      - name: Run offline tests with a machine-readable result
        env:
          PYTEST_ADDOPTS: --junitxml=artifacts/junit.xml
        run: python scripts/dev.py test
      - name: Build the platform regression report
        if: always()
        run: >-
          python scripts/regression_report.py gate
          --junit artifacts/junit.xml
          --dev-results .local/test-results.json
          --platform "${{ runner.os }}"
          --commit "${{ github.sha }}"
          --output "artifacts/regression-report-${{ runner.os }}-${{ matrix.python-version }}.json"
      - name: Upload the safe regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: regression-report-${{ runner.os }}-${{ matrix.python-version }}
          path: artifacts/regression-report-*.json
          if-no-files-found: error
          retention-days: 7

  release-gate:
    name: release gate (ubuntu-24.04)
    needs: test
    if: always()
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python scripts/dev.py setup-node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: regression-report-*
          path: artifacts/reports
          merge-multiple: true
      - run: python -c "import pathlib; pathlib.Path('artifacts').mkdir(exist_ok=True)"
      - run: python scripts/package_release.py build
      - name: Privacy, dependency, defaults and candidate gate
        run: >-
          python scripts/regression_report.py release-gate
          --reports artifacts/reports
          --dist dist
          --markers tests/security_regression/marker_set.json
          --expected-commit "${{ github.sha }}"
          --require-python-matrix
          --require-dist
          --output artifacts/release-gate.json
      - name: Upload the release gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-gate-report
          path: artifacts/release-gate.json
          if-no-files-found: error
          retention-days: 7
