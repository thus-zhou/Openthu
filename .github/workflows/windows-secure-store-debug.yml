name: Windows secure store debug
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.2
      - run: python -m pip install -e .
      - run: python scripts/windows_secure_store_debug.py
