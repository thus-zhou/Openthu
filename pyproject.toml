[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openthu"
dynamic = ["version"]
description = "Openthu：开放的清华校园服务、网络学堂与图书馆助手"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = ["cryptography==50.0.2", "Pillow==13.0.0", "requests==2.33.0"]

[project.optional-dependencies]
# The browser capability is a separate, explainable install step: the Python
# client is pinned, the Chromium download is never fetched by a lifecycle hook.
browser = ["playwright==1.57.0"]
# Kept for compatibility with the v0.1 extra name.
web = ["playwright==1.57.0"]
dev = ["pytest==8.3.4", "build==1.2.2.post1", "jsonschema==4.26.0", "playwright==1.57.0", "wheel==0.48.0"]

[project.urls]
Homepage = "https://github.com/thus-zhou/Openthu"
Issues = "https://github.com/thus-zhou/Openthu/issues"

[project.scripts]
openthu = "thu_assistant.__main__:main"
openthu-mcp = "thu_assistant.mcp_stdio:main"
learn-assistant = "learn_assistant.cli:main"
learn-assistant-mcp = "learn_assistant.mcp_stdio:main"
tsinghua-assistant = "thu_assistant.__main__:main"
tsinghua-assistant-mcp = "thu_assistant.mcp_stdio:main"

[tool.setuptools.dynamic]
version = {attr = "thu_assistant.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thu_assistant = [
    "*.js",
    "services.json",
    "package*.json",
    "THIRD_PARTY_NOTICES.txt",
    "*/README.md",
    "consent/README.md",
    "renewal/README.md",
]
learn_assistant = ["vendor/thu-learn-lib/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
