[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openthu"
version = "0.1.0"
description = "Openthu：开放的清华校园服务、网络学堂与图书馆助手"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["cryptography==50.0.2"]

[project.optional-dependencies]
web = ["requests>=2.31", "playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/thus-zhou/Openthu"
Issues = "https://github.com/thus-zhou/Openthu/issues"

[project.scripts]
openthu = "thu_assistant.__main__:main"
openthu-mcp = "thu_assistant.mcp_stdio:main"
learn-assistant = "learn_assistant.cli:main"
learn-assistant-mcp = "learn_assistant.mcp_stdio:main"
tsinghua-assistant = "thu_assistant.__main__:main"
tsinghua-assistant-mcp = "thu_assistant.mcp_stdio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thu_assistant = ["*.js", "services.json", "package*.json", "THIRD_PARTY_NOTICES.txt"]
learn_assistant = ["vendor/thu-learn-lib/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
